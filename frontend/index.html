<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>QLHS - Quản Lý Học Sinh</title>
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <h2>QLHS</h2>
        </div>
        <ul class="sidebar-menu">
            <li class="active" data-page="dashboard.html">🏠 Trang chủ</li>
            <li data-page="students.html">👥 Tiếp nhận học sinh</li>
            <li data-page="settings.html">⚙️ Thiết lập hệ thống</li>
            <li data-page="subjects.html">📚 Môn học</li>
            <li data-page="scores.html">📝 Bảng điểm</li>
            <li data-page="report-semester.html">📊 Báo cáo học kỳ</li>
            <li data-page="report-year.html">📈 Báo cáo năm</li>
        </ul>
    </aside>

    <div class="content-area">
        <header class="header">
            <button id="toggle-btn" class="hamburger">☰</button>
            <h1>Hệ Thống Quản Lý Học Sinh</h1>
        </header>

        <main id="main-content">
            <div class="welcome-box">
                <h2>Chào mừng bạn quay trở lại!</h2>
                <p>Hãy chọn một chức năng ở thanh menu bên trái.</p>
            </div>
        </main>

        <footer class="footer">
            <p>SE104 - Software Engineering Project | 2026</p>
        </footer>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script type="module" src="assets/js/router.js"></script>

<script>
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggle-btn');

    toggleBtn.addEventListener('click', () => {
        sidebar.classList.toggle('collapsed');
    });
    document.addEventListener('click', function (event) {
    const modal = document.getElementById("studentModal");

    // 1. Nếu bấm vào nút "Thêm học sinh mới"
    if (event.target.id === 'openModalBtn' || event.target.closest('#openModalBtn')) {
        if (modal) modal.style.display = "block";
    }

    // 2. Nếu bấm vào nút X hoặc nút Hủy
    if (event.target.id === 'closeModalBtn' || event.target.id === 'cancelBtn') {
        if (modal) modal.style.display = "none";
    }

    // 3. Nếu bấm ra ngoài vùng xám của Modal
    if (event.target === modal) {
        modal.style.display = "none";
    }
});
</script>
</body>
</html>
