<div class="settings-page">
    <div class="page-header">
        <h2>Cấu Hình Hệ Thống Học Tập</h2>
        <p>Thiết lập thông số nền tảng cho quản lý học sinh</p>
    </div>

    <div class="collapsed-bar"></div>

    <div class="settings-grid">
        <section class="config-card" data-index="0">
            <div class="card-title">
                <span>Năm Học</span>
                <button class="card-minimize-btn" title="Thu nhỏ">−</button>
            </div>
            <form id="form-year" class="modern-form">
                <input type="text" id="TenNamHoc" placeholder="Tên năm học (2025-2026)" required>

                <div class="row">
                    <div class="input-group">
                        <label>Ngày bắt đầu</label>
                        <input type="text" id="NgayBatDau" class="datepicker" placeholder="DD/MM/YYYY" required>
                    </div>
                    <div class="input-group">
                        <label>Ngày kết thúc</label>
                        <input type="text" id="NgayKetThuc" class="datepicker" placeholder="DD/MM/YYYY" required>
                    </div>
                </div>
                <small>
                    Định dạng: Ngày/Tháng/Năm (Ví dụ: 05/09/2025)
                </small>

                <button type="submit" class="btn-add">Thêm Năm Học</button>
            </form>

            <div class="table-scroll">
                <table id="table-year">
                    <thead>
                        <tr>
                            <th>Tên</th>
                            <th>Bắt đầu</th>
                            <th>Kết thúc</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="config-card" data-index="1">
            <div class="card-title">
                <span>Học Kỳ</span>
                <button class="card-minimize-btn" title="Thu nhỏ">−</button>
            </div>
            <div class="table-scroll">
                <table id="table-semester">
                    <thead>
                        <tr>
                            <th>Mã HK</th>
                            <th>Tên Học Kỳ</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="config-card" data-index="2">
            <div class="card-title">
                <span>Khối Lớp</span>
                <button class="card-minimize-btn" title="Thu nhỏ">−</button>
            </div>
            <div class="table-scroll">
                <table id="table-grade">
                    <thead>
                        <tr>
                            <th>Mã Khối</th>
                            <th>Tên Khối</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="config-card" data-index="3">
            <div class="card-title">
                <span>Lớp Học</span>
                <button class="card-minimize-btn" title="Thu nhỏ">−</button>
            </div>
            <form id="form-class" class="modern-form">
                <input type="text" id="TenLop" placeholder="Tên lớp (VD: 10A1)" required>
                <div class="row">
                    <select id="SelectNamHoc" required>
                        <option value="">Chọn năm...</option>
                    </select>
                    <select id="SelectKhoi" required>
                        <option value="">Chọn khối...</option>
                    </select>
                </div>
                <button type="submit" class="btn-add">Thêm Lớp</button>
            </form>
            <div class="table-scroll">
                <table id="table-class">
                    <thead>
                        <tr>
                            <th>Mã Lớp</th>
                            <th>Tên Lớp</th>
                            <th>Khối</th>
                            <th>Năm Học</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<!-- Modal chỉnh sửa -->
<div id="editModal" class="qlsv-modal">
    <div class="qlsv-modal-content" style="width:450px;">
        <div class="modal-header">
            <h3 id="editModalTitle">Chỉnh sửa</h3>
            <span class="close-modal" onclick="document.getElementById('editModal').style.display='none'">&times;</span>
        </div>
        <div class="modal-form">
            <div id="editModalBody"></div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="document.getElementById('editModal').style.display='none'">Hủy</button>
                <button id="editSaveBtn" class="qlsv-btn qlsv-btn--primary">Lưu</button>
            </div>
        </div>
    </div>
</div>
