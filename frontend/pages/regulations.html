<div class="parameter-page">
    <div class="page-header">
        <h2>Quy Định & Tham Số Hệ Thống</h2>
        <p>
            Điều chỉnh các hằng số quy chuẩn tính toán toàn trường (Tuổi tối đa, tối thiểu, điểm chuẩn, số lượng lớp,...)
        </p>
    </div>

    <div id="paramNotices" class="param-notices"></div>

    <div class="filter-group">
        <div class="toolbar-search">
            <input type="text" id="searchParamInput" placeholder="Tìm kiếm mã tham số...">
        </div>
    </div>

    <div class="students-table-wrapper">
        <table class="students-table">
            <thead>
                <tr>
                    <th style="width: 60px;">STT</th>
                    <th>Tên tham số (Mã định danh)</th>
                    <th>Giá trị áp dụng</th>
                    <th>Thao tác</th>
                </tr>
            </thead>
            <tbody id="parameterTableBody">
                <tr>
                    <td colspan="4" class="empty-table">
                        <i class="fas fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang tải dữ liệu tham số...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="qlsv-modal" id="paramModal">
    <div class="qlsv-modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Thêm Tham Số Hệ Thống</h3>
            <span class="close-modal">&times;</span>
        </div>
        <div class="modal-form">
            <form id="paramForm" onsubmit="return false;">
                <div class="form-group">
                    <label>Tên Tham Số (Viết liền, không dấu)</label>
                    <input type="text" id="paramNameInput" placeholder="Ví dụ: TuoiToiDa, DiemChuan">
                </div>
                <div class="form-group">
                    <label>Giá Trị Cấu Hình</label>
                    <input type="text" id="paramValueInput" placeholder="Ví dụ: 20 hoặc 5.0">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelParamBtn">Hủy Bỏ</button>
                    <button type="button" class="qlsv-btn qlsv-btn--primary" id="saveParamBtn">Lưu Thay Đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>
