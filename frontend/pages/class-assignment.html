<div class="qlsv-content-wrapper class-assignment-page">

    <div class="page-header">
        <h2>Phân Lớp Học Sinh</h2>
        <p>Xếp học sinh vào lớp theo năm học</p>
    </div>

    <div class="filter-group">
        <div class="filter-item">
            <label>Năm học:</label>
            <select id="filterNamHoc" class="qlsv-select"></select>
        </div>
        <div class="filter-item">
            <label>Học kỳ:</label>
            <select id="filterHocKy" class="qlsv-select"></select>
        </div>
        <div class="filter-item">
            <label>Khối:</label>
            <select id="filterKhoi" class="qlsv-select">
                <option value="">--Chọn--</option>
                <option value="10">Khối 10</option>
                <option value="11">Khối 11</option>
                <option value="12">Khối 12</option>
            </select>
        </div>
    </div>

    <div class="assignment-grid">

        <div class="assignment-card">
            <h3 class="section-title">Học sinh chưa xếp lớp</h3>
            <div class="qlsv-table-card">
                <table class="qlsv-table">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="checkAllUnassigned"></th>
                            <th>Mã HS</th>
                            <th>Họ Tên</th>
                            <th>Ngày Sinh</th>
                            <th>Giới Tính</th>
                        </tr>
                    </thead>
                    <tbody id="unassignedTable"></tbody>
                </table>
            </div>
        </div>

        <div class="assignment-card">
            <div class="assign-header">
                <h3 class="section-title">Học sinh đã xếp lớp</h3>
                <div class="assign-controls">
                    <div class="filter-item" style="margin:0;flex-direction:row;align-items:center;gap:8px;">
                        <label style="font-size:0.82rem;white-space:nowrap;">Lớp:</label>
                        <select id="assignClassSelect" class="qlsv-select" disabled></select>
                    </div>
                    <button class="qlsv-btn qlsv-btn--primary" id="assignBtn" disabled>
                        <i class="fas fa-user-plus"></i> Xếp vào lớp
                    </button>
                </div>
            </div>
            <div class="qlsv-table-card">
                <table class="qlsv-table">
                    <thead>
                        <tr>
                            <th>Mã HS</th>
                            <th>Họ Tên</th>
                            <th style="text-align:center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="assignedTable"></tbody>
                </table>
            </div>
        </div>

    </div>

</div>
<div id="transferModal" class="qlsv-modal">
    <div class="qlsv-modal-content">
        <div class="modal-header">
            <h3>Chuyển lớp học sinh</h3>
            <span class="close-modal" id="closeTransferModal">&times;</span>
        </div>

        <form id="transferForm" class="modal-form">

            <div class="form-group">
                <label>Chọn lớp mới</label>
                <select id="newClassSelect" class="qlsv-select"></select>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancelTransferBtn">
                    Hủy
                </button>
                <button type="submit" class="qlsv-btn qlsv-btn--primary">
                    Xác nhận
                </button>
            </div>

        </form>
    </div>
</div>
<!-- CONFIRM MODAL -->
<div id="confirmModal" class="qlsv-modal">
    <div class="qlsv-modal-content confirm-box">

        <h3 id="confirmTitle">Xác nhận</h3>
        <p id="confirmMessage">Bạn có chắc không?</p>

        <div class="modal-footer">
            <button id="confirmCancel" class="btn-cancel">Hủy</button>
            <button id="confirmOk" class="qlsv-btn qlsv-btn--primary">
                Đồng ý
            </button>
        </div>

    </div>
</div>
