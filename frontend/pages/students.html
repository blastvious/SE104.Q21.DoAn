<div class="qlsv-content-wrapper">
    <div class="page-header">
        <h2>Tiếp Nhận Học Sinh</h2>
        <p>Quản lý hồ sơ học sinh, nhập liệu từ Excel</p>
    </div>

    <div class="filter-group" style="display: flex; justify-content: center; gap: 12px; align-items: center;">
        <button class="qlsv-btn qlsv-btn--primary" id="openModalBtn">
            <i class="fas fa-plus"></i> Thêm học sinh mới
        </button>
        <input type="file" id="excelFile" accept=".xlsx, .xls" hidden />
        <button type="button" class="qlsv-btn qlsv-btn--blue"
            onclick="document.getElementById('excelFile').click()">
            <i class="fas fa-folder-open"></i> Chọn File Excel
        </button>
    </div>

    <div class="qlsv-table-card">
        <div class="table-responsive">
            <table class="qlsv-table">
                <thead>
                    <tr>
                        <th>Mã HS</th>
                        <th>Họ Tên</th>
                        <th>Ngày Sinh</th>
                        <th>Giới Tính</th>
                        <th>Địa Chỉ</th>
                        <th>Email</th>
                        <th>SĐT</th>
                        <th style="text-align: center;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="studentTable">
                </tbody>
            </table>
        </div>
    </div>

    <div id="studentModal" class="qlsv-modal">
        <div class="qlsv-modal-content">
            <div class="modal-header">
                <h3>Thêm Học Sinh Mới</h3>
                <span class="close-modal" id="closeModalBtn">&times;</span>
            </div>
            <form id="studentForm" class="modal-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" id="HoTen" placeholder="Nguyễn Văn A" required>
                    </div>
                    <div class="form-group">
                        <label>Giới tính</label>
                        <select id="GioiTinh">
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ngày sinh</label>
                        <input type="text" id="NgaySinh" class="datepicker" placeholder="DD/MM/YYYY" required>
                        <small style="font-size: 0.75rem;">Ví dụ: 15/05/2008</small>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" id="SoDienThoai" placeholder="090..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="Email" placeholder="example@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input type="text" id="DiaChi" placeholder="Địa chỉ thường trú" required>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelBtn">Hủy</button>
                    <button type="submit" class="qlsv-btn qlsv-btn--primary">Lưu học sinh</button>
                </div>
            </form>
        </div>
    </div>

    <div class="qlsv-modal" id="importProgressModal">
        <div class="qlsv-modal-content" style="max-width:420px;padding:32px;text-align:center;">
            <div style="width:48px;height:48px;border:5px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
            <div id="importProgressText" style="font-size:16px;font-weight:600;color:#0f172a;margin-bottom:4px;">Đang xử lý...</div>
            <div id="importProgressDetail" style="font-size:13px;color:#64748b;margin-bottom:16px;"></div>
            <div style="width:100%;background:#e2e8f0;border-radius:8px;height:10px;overflow:hidden;">
                <div id="importProgressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#2563eb,#3b82f6);border-radius:8px;transition:width 0.4s ease;"></div>
            </div>
            <div id="importProgressPercent" style="font-size:12px;color:#64748b;margin-top:6px;">0%</div>
        </div>
    </div>
</div>
