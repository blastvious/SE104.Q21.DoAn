<h2>Tiếp nhận học sinh</h2>
<form id="studentForm">
    <label>Tên học sinh:</label>
    <input type="text" id="HoTen" required>

    <label>Ngày sinh (Ví dụ: 15/05/2008):</label>
    <input type="text" id="NgaySinh" placeholder="DD/MM/YYYY" required>

    <label>Giới tính:</label>
    <select id="GioiTinh">
        <option value="Nam">Nam</option>
        <option value="Nữ">Nữ</option>
    </select>

    <label>Địa chỉ:</label>
    <input type="text" id="DiaChi" required>

    <label>Email:</label>
    <input type="email" id="Email" required>

    <label>Số điện thoại:</label>
    <input type="tel" id="SoDienThoai" required>

    <button type="submit">Lưu học sinh</button>
    <div class="excel-import-area">
        <h3>Hoặc nhập từ File Excel</h3>
        <input type="file" id="excelFile" accept=".xlsx, .xls" />
        <button type="button" id="btnUploadExcel">Tải lên Excel</button>
    </div>
</form>

<p id="msg"></p>
<hr>
<h3>Danh sách học sinh</h3>
<table border="1" width="100%">
    <thead>
        <tr>
            <th>Mã HS</th>
            <th>Họ Tên</th>
            <th>Ngày Sinh</th>
            <th>Giới Tính</th>
            <th>Địa Chỉ</th>
            <th>Email</th>
            <th>SĐT</th>
        </tr>
    </thead>
    <tbody id="studentTable"></tbody>
</table>
